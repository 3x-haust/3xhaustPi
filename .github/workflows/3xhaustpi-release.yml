name: 3xhaustPi native release

on:
  workflow_dispatch:
  push:
    tags:
      - "3xhaustpi-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - windows-arm64
          - windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@3xhaust/semantic-contract
      - run: npm run build --workspace=3xhaustpi
      - run: node packages/3xhaustpi/scripts/build-native-release.mjs --target ${{ matrix.target }} --output artifacts/native
      - uses: actions/upload-artifact@v4
        with:
          name: 3xhaustpi-${{ matrix.target }}
          path: artifacts/native/*
          if-no-files-found: error

  checksums:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: 3xhaustpi-*
          path: artifacts/native
          merge-multiple: true
      - name: Verify per-archive checksums and write release manifest
        working-directory: artifacts/native
        run: |
          for file in *.sha256; do sha256sum --check "$file"; done
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -- *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: 3xhaustpi-native-release
          path: artifacts/native/*
          if-no-files-found: error
      - name: Attach archives to tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/native/* --generate-notes --verify-tag
