name: 3xhaustPi compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/ai/**"
      - "packages/agent/**"
      - "packages/semantic-contract/**"
      - "packages/core/**"
      - "packages/pi-adapter/**"
      - "packages/pi-session/**"
      - "3xhaust/**"
      - "package-lock.json"
      - ".github/workflows/3xhaust-compat.yml"
  push:
    branches: [main, "candidates/3xhaustpi/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: 3xhaust-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    env:
      PI_NO_LOCAL_LLM: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Reject high-severity dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Validate 3xhaustPi manifests
        shell: bash
        run: |
          node -e "for (const p of ['3xhaust/compatibility.json','3xhaust/patches.json']) JSON.parse(require('node:fs').readFileSync(p,'utf8'))"
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('3xhaust/compatibility.json', 'utf8'));
          for (const expected of manifest.packages) {
            const actual = JSON.parse(fs.readFileSync(`${expected.workspace}/package.json`, 'utf8'));
            if (actual.name !== expected.name || actual.version !== expected.version) {
              throw new Error(`Compatibility drift: ${expected.workspace} is ${actual.name}@${actual.version}`);
            }
            for (const key of expected.requiredExports) {
              if (!actual.exports?.[key]) throw new Error(`Missing export ${expected.name}:${key}`);
            }
          }
          NODE

      - name: Build consumed packages
        shell: bash
        run: |
          npm --prefix packages/ai run hydrate-model-data
          npm --prefix packages/ai run build:offline
          npm --prefix packages/agent run build
          npm --prefix packages/semantic-contract run build
          npm --prefix packages/core run build
          npm --prefix packages/pi-adapter run build
          npm --prefix packages/pi-session run build

      - name: Test provider/model core
        run: npm --prefix packages/ai test
      - name: Test fail-closed session bridge
        run: |
          npm --prefix packages/semantic-contract test
          npm --prefix packages/core test
          npm --prefix packages/pi-adapter test
          npm --prefix packages/pi-session test

      - name: Smoke-test the 3xhaustPi embedding surface
        run: node 3xhaust/verify-embedding.mjs

      - name: Inventory package and binary assets
        shell: bash
        run: |
          mkdir -p .artifacts/3xhaust-compat
          npm sbom --sbom-format cyclonedx > .artifacts/3xhaust-compat/sbom.cdx.json
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('3xhaust/compatibility.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const licenses = Object.entries(lock.packages)
            .filter(([location, pkg]) => location && pkg.name && pkg.version)
            .map(([location, pkg]) => ({ location, name: pkg.name, version: pkg.version, license: pkg.license ?? 'UNKNOWN' }))
            .sort((a, b) => a.name.localeCompare(b.name) || a.version.localeCompare(b.version));
          fs.writeFileSync('.artifacts/3xhaust-compat/licenses.json', JSON.stringify({ schemaVersion: 1, licenses }, null, 2));
          const npm = process.platform === 'win32' ? 'npm.cmd' : 'npm';
          const packages = manifest.packages.map((item) => {
            const packed = JSON.parse(cp.execFileSync(npm, ['pack', '--dry-run', '--json'], {
              cwd: item.workspace,
              encoding: 'utf8',
              shell: process.platform === 'win32',
            }));
            const files = packed[0].files.map((file) => file.path).sort();
            const hash = crypto.createHash('sha256');
            for (const file of files) {
              hash.update(file);
              hash.update(fs.readFileSync(path.join(item.workspace, file)));
            }
            return { name: item.name, version: item.version, files, contentSha256: hash.digest('hex') };
          });
          const assetChecks = manifest.artifacts.requiredInventory.map((asset) => ({
            asset,
            present: fs.existsSync(asset),
            optional: asset === 'node_modules/@mariozechner/clipboard',
          }));
          const missing = assetChecks.filter((item) => !item.present && !item.optional);
          const receipt = {
            schemaVersion: manifest.artifacts.receiptSchemaVersion,
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            repositoryId: process.env.GITHUB_REPOSITORY_ID,
            ref: process.env.GITHUB_REF,
            workflowRef: process.env.GITHUB_WORKFLOW_REF,
            workflowSha: process.env.GITHUB_WORKFLOW_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            event: process.env.GITHUB_EVENT_NAME,
            upstreamCommit: manifest.repository.upstreamCommit,
            patchManifest: '3xhaust/patches.json',
            runner: `${process.platform}-${process.arch}`,
            node: process.version,
            packages,
            assetChecks,
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync('.artifacts/3xhaust-compat/receipt.json', JSON.stringify(receipt, null, 2));
          if (missing.length) throw new Error(`Required assets missing: ${missing.map((x) => x.asset).join(', ')}`);
          NODE

      - name: Upload exact-commit compatibility receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 3xhaust-compat-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/3xhaust-compat/
          if-no-files-found: error
          retention-days: 30

      - name: Attest exact-commit compatibility receipt
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: .artifacts/3xhaust-compat/**
